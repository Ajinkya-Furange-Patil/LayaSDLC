[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layasdlc-decision"
version = "0.1.0"
description = "LayaSDLC decision service: bounded engineering-decision classification with safe fallback"
# Inline rather than a file: the human-facing README lives at the repo root, and
# setuptools resolves this path relative to pyproject.toml.
readme = { text = "See the repository README for verified vs planned capabilities.", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Deliberately empty. The decision service is stdlib-only at runtime
# (sqlite3, urllib, json, dataclasses, enum). Every dependency we do not
# take is one fewer thing that can break on Python 3.14 or need a network
# install. See docs/adr/0001-cloud-first-laya-provider.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires network access to a live Laya endpoint (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
